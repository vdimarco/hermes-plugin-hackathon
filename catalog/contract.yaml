version: "1.2.0"
description: "A definition of done the agent cannot fake, and a check on every claim of finished work. Contract: before a coding task the agent proposes shell checks and locked paths (usually the tests); you approve them with /contract approve. From then on writes to locked paths are blocked (write_file, patch, shell writes such as sed -i, >, rm, mv, git checkout, and file writes in execute_code), also for subagents the session starts, a turn that edited code cannot finish while a check fails, has not run, or passed before the last edit, and when every check passes the plugin writes a receipt: a hash-chained JSON record with the exit codes, output hashes and git tree id, which `hermes contract verify` checks and can turn into a re-run script. Vouch, the built-in claim check, runs on every turn with or without a contract: it finds claims such as \"all tests pass\", \"I updated src/app.py\", \"pushed to origin\" or \"deployed\" in the final reply and matches each one to the commands, exit codes and file writes of the session. It catches exit codes hidden by pipes, test runs that found no tests, edits made after the last passing run, a rejected git push, and a claimed edit to a file that was only read. A false claim sends the agent back once; claims that are still unsupported get a short footer. Hermes Desktop: a Contract pane with the live checklist (pass, fail, stale, not run), the locks and the receipt hash, status-bar chips for the contract and for the claim verdicts, a toast when the lock blocks an edit or when Vouch sends the agent back, and a palette command to copy the receipt hash. Disclosure — no network calls, no credentials, no telemetry, no background threads. contract_run runs the approved check commands, plus one read-only git command (rev-parse, stash create, status) for the receipt, through the Hermes terminal tool, so approvals and the configured terminal backend apply; the plugin never starts processes itself. Keeps an in-memory tool record per session (at most 64 sessions, 400 events each: tool name, command text, file paths, exit code, the last 600 characters of command output; never file contents). Stores contracts (checks, locks, latest results with the last 400 characters of output), the last 20 receipts, claim-check totals and the last 50 flagged claims in its plugin state under HERMES_HOME/plugin-data; `hermes contract export --out` writes a receipt to the file you name. Blocks tool calls that would change locked paths, adds a short per-turn context note while a contract is open, and appends a footer to replies only when a claim is unsupported or the contract has news (configurable). Sends plugin.contract.state snapshots (title, checks with commands and reasons, locks, receipt hash), plugin.contract.blocked events and plugin.contract.report events (claim counts and up to 6 flagged claims with reasons) to Desktop windows attached to the same Hermes process; the desktop half keeps the last 20 snapshots and 20 reports in Desktop plugin storage."
