name: contract
version: 1.2.0
description: >-
  Definition of done that the agent cannot fake. Before a coding task, the agent
  proposes shell checks and locked paths; you approve them with /contract approve.
  The agent then cannot edit the locked tests, cannot finish while a check fails,
  and gets a receipt (hash chain plus git tree id) when every check passes. On every
  turn, Vouch checks each claim in the reply ("all tests pass", "pushed to origin")
  against the tool record and sends the agent back when a claim is false.
author: vdimarco
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/vdimarco/hermes-plugin-hackathon
tags: [verification, coding, tests, trust, hooks]
requires_hermes: ">=0.22.0"
provides_tools:
  - contract_propose
  - contract_status
  - contract_run
  - vouch_evidence
  - vouch_check
provides_hooks:
  - post_tool_call
  - pre_tool_call
  - pre_llm_call
  - pre_verify
  - transform_llm_output
  - on_session_delete
  - subagent_start
config_schema:
  require_approval:
    type: bool
    default: true
    label: Require approval
    description: A contract the agent proposes is enforced only after /contract approve. Turn off for unattended runs.
  lock_tests:
    type: bool
    default: true
    label: Lock test files
    description: Also lock common test paths (tests/*, test_*.py, *.test.*, *.spec.*, conftest.py).
  max_nudges:
    type: int
    default: 2
    label: Max gate nudges per turn
    description: How many times one turn can be sent back while a check fails. Hermes also caps this with agent.max_verify_nudges.
  footer:
    type: bool
    default: true
    label: Reply footer
    description: >-
      Add a short footer under replies: the claims Vouch could not verify, and one
      status line about the contract.
  claims_mode:
    type: str
    choices: [nudge, annotate, "off"]
    default: nudge
    label: Claim check (Vouch)
    description: >-
      nudge = send the agent back once when a claim in its reply is false or
      unsupported, then annotate; annotate = only add the footer; off = no claim check.
  claims_max_nudges:
    type: int
    default: 1
    label: Max claim nudges per turn
    description: How many times one turn can be sent back for a false claim. Hermes also caps this with agent.max_verify_nudges.
  claims_footer_verified:
    type: bool
    default: false
    label: Show verified claims
    description: Also list claims that passed in the footer (useful for demos and audits).
  claims_kinds:
    type: list
    default: []
    label: Claim types
    description: >-
      Limit the claim check to these types (tests, build, lint, edit, ran, commit,
      push, install, deploy, verified). Empty = all.
