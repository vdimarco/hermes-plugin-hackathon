name: vouch
version: 1.0.0
description: >-
  Checks the agent's "done" against the tool record. Vouch finds claims such as
  "all tests pass", "I updated src/app.py" or "pushed to main" in the final reply
  and matches each one to the commands, exit codes and file writes of the session.
  A false or unsupported claim sends the agent back to fix it once, and what is
  still unsupported gets a short footer in the reply.
author: vdimarco
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/vdimarco/hermes-plugin-hackathon
tags: [verification, coding, trust, hooks]
requires_hermes: ">=0.22.0"
provides_tools:
  - vouch_evidence
  - vouch_check
provides_hooks:
  - post_tool_call
  - pre_verify
  - transform_llm_output
  - on_session_delete
config_schema:
  mode:
    type: str
    choices: [nudge, annotate, "off"]
    default: nudge
    label: Mode
    description: >-
      nudge = send the agent back once when a claim is false or unsupported, then
      annotate; annotate = only add the footer; off = record only.
  max_nudges:
    type: int
    default: 1
    label: Max nudges per turn
    description: How many times one turn can be sent back. Hermes also caps this with agent.max_verify_nudges.
  footer:
    type: bool
    default: true
    label: Reply footer
    description: Add a short Vouch note under replies that contain unsupported claims.
  footer_verified:
    type: bool
    default: false
    label: Show verified claims
    description: Also list claims that passed in the footer (useful for demos and audits).
  kinds:
    type: list
    default: []
    label: Claim types
    description: >-
      Limit the check to these claim types (tests, build, lint, edit, ran, commit,
      push, install, deploy, verified). Empty = all.
