name: multiverse
version: 1.1.1
description: >-
  Try a coding task several ways at once and keep the one that passes. One git
  worktree and one subagent per attempt, each subagent pinned to its own worktree,
  the same checks run in every worktree, a scoreboard, and one call to apply the
  winner. Optional delegation backend gives each attempt its own model.
author: vdimarco
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/vdimarco/hermes-plugin-hackathon
tags: [coding, delegation, subagents, git, best-of-n]
requires_hermes: ">=0.22.0"
provides_tools:
  - multiverse_race
  - multiverse_open
  - multiverse_judge
  - multiverse_adopt
  - multiverse_close
provides_hooks:
  - subagent_start
  - subagent_stop
  - pre_tool_call
